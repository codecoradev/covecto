name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag-on-main:
    name: Verify tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check tag exists on main
        run: |
          git fetch origin ${{ github.ref_name }}
          git merge-base --is-ancestor ${{ github.ref_name }} origin/main || \
            (echo "Error: Tag ${{ github.ref_name }} must be on main branch" && exit 1)

  build:
    name: Build (${{ matrix.target }})
    needs: [verify-tag-on-main]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --target ${{ matrix.target }}

  publish-crates:
    name: Publish to crates.io
    needs: [verify-tag-on-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish covecto-core
        run: cargo publish -p covecto-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish covecto-api
        run: cargo publish -p covecto-api --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish covecto (CLI)
        run: cargo publish -p covecto --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            cargo build --workspace --release --target $target
          done
          cargo build --workspace --release --target x86_64-pc-windows-msvc
      - name: Package
        run: |
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            tar czf "dist/covecto-${{ github.ref_name }}-${target}.tar.gz" \
              -C target/$target/release covecto covecto-api
          done
          cd target/x86_64-pc-windows-msvc/release
          7z a ../../../dist/covecto-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip covecto.exe covecto-api.exe
          cd -
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true