name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag-on-main:
    name: Verify tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag exists on main
        run: |
          git fetch origin main
          TAG_SHA=$(git rev-parse "${{ github.ref }}^{commit}")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" = "$MAIN_SHA" ]; then
            echo "✅ Tag is main HEAD"
          elif git merge-base --is-ancestor "$TAG_SHA" origin/main 2>/dev/null; then
            echo "✅ Tag commit is in main history"
          else
            echo "::error::Tag commit is NOT on main. Merge develop → main via PR before tagging."
            exit 1
          fi

  build-release:
    name: Build ${{ matrix.target }}
    needs: [verify-tag-on-main]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} -p covecto -p covecto-api
      - name: Strip (Unix)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/covecto target/${{ matrix.target }}/release/covecto-api || true
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "${{ github.workspace }}/dist/covecto-${{ matrix.target }}-${{ github.ref_name }}.tar.gz" covecto covecto-api
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a "${{ github.workspace }}/dist/covecto-${{ matrix.target }}-${{ github.ref_name }}.zip" covecto.exe covecto-api.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: covecto-${{ matrix.target }}-${{ github.ref_name }}
          path: dist/

  publish-crates:
    name: Publish to crates.io
    needs: [verify-tag-on-main]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish covecto-core
        run: cargo publish -p covecto-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish covecto-api
        run: cargo publish -p covecto-api --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish covecto (CLI)
        run: cargo publish -p covecto --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: cd release-artifacts && sha256sum * > checksums-sha256.txt && cat checksums-sha256.txt
      - name: Extract version
        id: version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
      - name: Extract changelog
        id: changelog
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          awk "/^## \[${CLEAN_VER}\]/{found=1; next} /^## \[/{found=0} found && !/^\[.*\]: https:/" CHANGELOG.md > changelog-body.md || true
          echo "CLEAN_VER=${CLEAN_VER}" >> $GITHUB_OUTPUT
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: changelog-body.md
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  docker:
    name: Build & Push Docker Image
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        id: dockerhub
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: covecto-*-${{ github.ref_name }}
          path: release-artifacts
          merge-multiple: true

      - name: Extract binaries for Docker context
        run: |
          mkdir -p binaries
          cd release-artifacts
          AMD64=$(find . -name "covecto-x86_64-unknown-linux-gnu-${{ github.ref_name }}.tar.gz" | head -1)
          ARM64=$(find . -name "covecto-aarch64-unknown-linux-gnu-${{ github.ref_name }}.tar.gz" | head -1)
          if [ -z "$AMD64" ] || [ -z "$ARM64" ]; then
            echo "::error::Linux binary artifacts not found"
            find . -type f | head -20
            exit 1
          fi
          tar xzf "$AMD64" -C ../binaries
          mv ../binaries/covecto ../binaries/covecto-amd64
          tar xzf "$ARM64" -C ../binaries
          mv ../binaries/covecto ../binaries/covecto-arm64
          chmod +x ../binaries/*
          ls -lh ../binaries/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.dockerhub.outcome == 'success' && 'docker.io/codecoradev/covecto' || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.binaries
          platforms: linux/amd64,linux/arm64/v8
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
