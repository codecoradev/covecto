[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/api",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codecoradev/covecto"
readme = "README.md"
authors = ["CodeCora <hello@codecora.dev>"]

[workspace.dependencies]
# Internal
covecto-core = { path = "crates/core" }

# Image
image = "0.25"

# Vectorization engines
vtracer = "0.6.5"
rayon = "1.11"

# HTTP API
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tower = "0.5"
http-body-util = "0.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress
indicatif = "0.17"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"